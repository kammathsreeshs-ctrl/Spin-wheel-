<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Barber Company - Spin & Win</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@500&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  padding:20px;
  text-align:center;
  font-family:'Poppins', sans-serif;
  background: linear-gradient(135deg,#fbc2eb,#a6c1ee,#fddb92);
}

h1{
  font-family:'Playfair Display', serif;
  font-size:40px;
  margin-bottom:5px;
}

h2{
  margin-top:0;
  font-size:20px;
  color:#333;
}

#wrapper{
  position:relative;
  width:520px;
  margin:30px auto;
}

#pointer{
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:22px solid transparent;
  border-right:22px solid transparent;
  border-bottom:45px solid red;
  z-index:10;
}

canvas{
  display:block;
  margin:0 auto;
  background:#fff;
  border-radius:50%;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

button{
  padding:16px 45px;
  font-size:20px;
  border:none;
  border-radius:30px;
  background:#000;
  color:#fff;
  cursor:pointer;
}

#result{
  margin-top:20px;
  font-size:22px;
  font-weight:600;
}
</style>
</head>

<body>

<h1>The Barber Company</h1>
<h2>Special Offer</h2>

<div id="wrapper">
  <div id="pointer"></div>
  <canvas id="wheel" width="520" height="520"></canvas>
</div>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

<script>
const prizes = [
  "10%",
  "Better luck next time",
  "30%",
  "Better luck next time",
  "50%",
  "Better luck next time",
  "Gift voucher"
];

const colors = [
  "#ff7675",
  "#ffeaa7",
  "#74b9ff",
  "#fab1a0",
  "#55efc4",
  "#a29bfe",
  "#fdcb6e"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const size = canvas.width;
const center = size / 2;
const radius = center - 15;
const slice = 2 * Math.PI / prizes.length;

let angle = 0;
let spinning = false;

function drawWheel(){
  ctx.clearRect(0,0,size,size);
  for(let i=0;i<prizes.length;i++){
    let start = angle + i * slice;
    let end = start + slice;

    ctx.beginPath();
    ctx.moveTo(center,center);
    ctx.arc(center,center,radius,start,end);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.stroke();

    ctx.save();
    ctx.translate(
      center + Math.cos(start + slice/2) * radius * 0.65,
      center + Math.sin(start + slice/2) * radius * 0.65
    );
    ctx.rotate(start + slice/2);
    ctx.fillStyle="#000";
    ctx.font="16px Poppins";
    ctx.textAlign="center";
    ctx.fillText(prizes[i],0,0);
    ctx.restore();
  }
}

drawWheel();

function spin(){
  if(spinning) return;
  spinning = true;
  document.getElementById("result").innerText = "";

  let spinAngle = Math.random() * 360 + 2160;
  let duration = 5000;
  let startTime = null;

  function animate(time){
    if(!startTime) startTime = time;
    let progress = time - startTime;
    let t = progress / duration;
    t = 1 - Math.pow(1 - t, 3);

    angle = (spinAngle * t) * Math.PI / 180;
    drawWheel();

    if(progress < duration){
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      let finalAngle = (angle + Math.PI * 1.5) % (2 * Math.PI);
      let index = Math.floor(prizes.length - finalAngle / slice) % prizes.length;
      document.getElementById("result").innerText = "🎁 Result: " + prizes[index];
    }
  }
  requestAnimationFrame(animate);
}
</script>

</body>
</html>
