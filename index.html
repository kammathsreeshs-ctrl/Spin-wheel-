<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Barber Company - Spin & Win</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  padding:20px;
  text-align:center;
  font-family:'Poppins', sans-serif;
  background: linear-gradient(135deg,#fbc2eb,#a6c1ee,#fddb92);
}

h1{
  font-family:'Playfair Display', serif;
  font-size:40px;
  margin-bottom:5px;
}

h2{
  margin-top:0;
  font-size:20px;
}

#wrapper{
  position:relative;
  width:520px;
  margin:30px auto;
}

#pointer{
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:22px solid transparent;
  border-right:22px solid transparent;
  border-top:45px solid #d63031;  /* ⬅️ POINTS DOWN */
  z-index:10;
}

canvas{
  display:block;
  margin:0 auto;
  background:#transparent;
  border-radius:50%;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

button{
  padding:16px 45px;
  font-size:20px;
  border:none;
  border-radius:30px;
  background:#000;
  color:#fff;
  cursor:pointer;
}

#result{
  margin-top:25px;
  font-size:26px;
  font-weight:600;
  padding:15px 25px;
  background:#fff;
  display:inline-block;
  border-radius:15px;
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<h1>The Barber Company</h1>
<h2>Special Offer</h2>

<div id="wrapper">
  <div id="pointer"></div>
  <canvas id="wheel" width="520" height="520"></canvas>
</div>

<button onclick="spin()">SPIN</button>

<div id="result">🎉 Try your luck!</div>

<audio id="spinSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8e2a1c6a44.mp3"></audio>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const prizes = [
  "10% OFF",
  "Better luck next time",
  "30% OFF",
  "Better luck next time",
  "50% OFF",
  "Better luck next time",
  "Gift Voucher"
];

const colors = [
  "#ff7675",
  "#ffeaa7",
  "#74b9ff",
  "#fab1a0",
  "#55efc4",
  "#a29bfe",
  "#fdcb6e"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const size = canvas.width;
const center = size / 2;
const radius = center - 15;
const slice = 2 * Math.PI / prizes.length;

// pointer at 12 o'clock
const POINTER_ANGLE = -Math.PI / 2;

let angle = 0;
let spinning = false;

function drawWheel(){
  ctx.clearRect(0,0,size,size);

  for(let i=0;i<prizes.length;i++){
    const start = angle + i * slice;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(center,center);
    ctx.arc(center,center,radius,start,end);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.stroke();

    ctx.save();
    ctx.translate(
      center + Math.cos(start + slice/2) * radius * 0.65,
      center + Math.sin(start + slice/2) * radius * 0.65
    );
    ctx.rotate(start + slice/2);
    ctx.fillStyle="#000";
    ctx.font="16px Poppins";
    ctx.textAlign="center";
    ctx.fillText(prizes[i],0,0);
    ctx.restore();
  }
}

drawWheel();

function spin(){
  if(spinning) return;
  spinning = true;

  document.getElementById("result").innerText = "🎡 Spinning...";
  document.getElementById("spinSound").currentTime = 0;
  document.getElementById("spinSound").play();

  const totalSpin = Math.random() * Math.PI * 6 + Math.PI * 10;
  const duration = 5000;
  let startTime = null;

  function animate(time){
    if(!startTime) startTime = time;
    const progress = time - startTime;
    const t = Math.min(progress / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);

    angle = totalSpin * ease;
    drawWheel();

    if(progress < duration){
      requestAnimationFrame(animate);
    } else {
      spinning = false;

      // 🔒 SAFE NORMALIZATION
      const stopAngle =
        (POINTER_ANGLE - angle) % (2 * Math.PI);
      const normalized =
        stopAngle < 0 ? stopAngle + 2 * Math.PI : stopAngle;

      let index = Math.floor(normalized / slice);
      index = Math.min(Math.max(index, 0), prizes.length - 1);

      const prize = prizes[index];

      document.getElementById("result").innerText =
        "🎁 You won: " + prize;

      confetti({
        particleCount: 180,
        spread: 80,
        origin: { y: 0.6 }
      });
    }
  }

  requestAnimationFrame(animate);
}
</script>

</body>
</html>
