<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Barber Company - Spin & Win</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  min-height:100vh;
  font-family: 'Poppins', sans-serif;
  text-align:center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{
  margin-top:25px;
  font-family: 'Playfair Display', serif;
  font-size:42px;
  color:#2d3436;
  letter-spacing:2px;
}

h2{
  margin-top:5px;

  color:#444;
}

#wrapper{
  position:relative;
  width:520px;
  height:520px;
  margin-top:25px;
}

#pointer{

  top:-5px;
  left:50%;

  height:0;
  border-left:22px solid transparent;
  border-right:22px solid transparent;
  border-bottom:45px solid #d63031;
  z-index:10;
}

canvas{
  background:#fff;
  border-radius:50%;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

button{

  padding:16px 45px;
  font-size:20px;
  border:none;
  border-radius:30px;
  background:#2d3436;
  color:#fff;
  cursor:pointer;
}

  background:#000;
