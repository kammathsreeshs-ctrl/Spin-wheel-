<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spin & Win</title>

<style>
body{
  font-family: Arial;
  text-align: center;
  background: #f4f4f4;
}

#pointer{
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-bottom:30px solid red;
  margin:20px auto -10px;
}

#wheel{
  width:320px;
  height:320px;
  border-radius:50%;
  border:8px solid #333;
  margin:20px auto;
  background: conic-gradient(
    #ff7675 0deg 51deg,
    #74b9ff 51deg 102deg,
    #55efc4 102deg 153deg,
    #ffeaa7 153deg 204deg,
    #fab1a0 204deg 255deg,
    #a29bfe 255deg 306deg,
    #fdcb6e 306deg 360deg
  );
}

button{
  padding:12px 30px;
  font-size:18px;
  cursor:pointer;
}

#result{
  font-size:18px;
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>🎉 Spin & Win 🎉</h2>

<div id="pointer"></div>
<div id="wheel"></div>

<button onclick="spin()">SPIN</button>
<p id="result"></p>

<script>
let spinning = false;

let prizes = [
  "10%",
  "30%",
  "50%",
  "Better luck next time",
  "Better luck next time",
  "Better luck next time",
  "Gift voucher"
];

function spin(){
  if(spinning) return;
  spinning = true;

  let wheel = document.getElementById("wheel");
  let deg = Math.floor(3000 + Math.random() * 3000);

  wheel.style.transition = "transform 4s ease-out";
  wheel.style.transform = "rotate(" + deg + "deg)";

  setTimeout(()=>{
    let prize = prizes[Math.floor(Math.random() * prizes.length)];
    document.getElementById("result").innerText =
      "🎁 Result: " + prize;
    spinning = false;
  },4000);
}
</script>

</body>
</html>
