 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Barber Company - Spin & Win</title>

<style>
body{
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f2f2f2;
  margin:0;
  padding:20px;
}

h1{
  margin:10px 0 0;
  font-size:28px;
}

h2{
  margin:5px 0 20px;
  font-size:18px;
  color:#555;
}

#wrapper{
  position: relative;
  width: 380px;
  margin: 0 auto;
}

#pointer{
  position:absolute;
  top:-5px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-bottom:35px solid red;
  z-index:10;
}

canvas{
  display:block;
  margin:0 auto;
}

button{
  margin-top:25px;
  padding:14px 35px;
  font-size:18px;
  cursor:pointer;
}

#result{
  font-size:20px;
  font-weight:bold;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>The Barber Company</h1>
<h2>Special Offer</h2>

<div id="wrapper">
  <div id="pointer"></div>
  <canvas id="wheel" width="380" height="380"></canvas>
</div>

<button onclick="spin()">SPIN</button>

<p id="result"></p>

<script>
// 🔹 ORDERED EXACTLY AS REQUESTED
const prizes = [
  "10%",
  "Better luck next time",
  "30%",
  "Better luck next time",
  "50%",
  "Better luck next time",
  "Gift voucher"
];

const colors = [
  "#ff7675",
  "#ffeaa7",
  "#74b9ff",
  "#fab1a0",
  "#55efc4",
  "#a29bfe",
  "#fdcb6e"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const size = canvas.width;
const center = size / 2;
const radius = center - 10;
const slice = 2 * Math.PI / prizes.length;

let currentAngle = 0;
let spinning = false;

function drawWheel(){
  for(let i = 0; i < prizes.length; i++){
    let angle = currentAngle + i * slice;

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, angle, angle + slice);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.stroke();

    ctx.save();
    ctx.translate(
      center + Math.cos(angle + slice/2) * radius * 0.65,
      center + Math.sin(angle + slice/2) * radius * 0.65
    );
    ctx.rotate(angle + slice/2);
    ctx.fillStyle = "#000";
    ctx.font = "14px Arial";
    ctx.textAlign = "center";
    ctx.fillText(prizes[i], 0, 0);
    ctx.restore();
  }
}

drawWheel();

function spin(){
  if(spinning) return;
  spinning = true;
  document.getElementById("result").innerText = "";

  let spinAngle = Math.random() * 360 + 1800;
  let spinTime = 4500;
  let start = null;

  function animate(timestamp){
    if(!start) start = timestamp;
    let progress = timestamp - start;
    let ease = progress / spinTime;
    ease = 1 - Math.pow(1 - ease, 3);

    currentAngle = (spinAngle * ease) * Math.PI / 180;
    ctx.clearRect(0,0,size,size);
    drawWheel();

    if(progress < spinTime){
      requestAnimationFrame(animate);
    } else {
      spinning = false;

      // Pointer is at TOP
      let finalAngle = (currentAngle + Math.PI * 1.5) % (2 * Math.PI);
      let index = Math.floor(prizes.length - (finalAngle / slice)) % prizes.length;

      document.getElementById("result").innerText =
        "🎁 Result: " + prizes[index];
    }
  }

  requestAnimationFrame(animate);
}
</script>

</body>
</html>
