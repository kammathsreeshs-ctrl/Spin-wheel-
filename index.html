<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spin & Win</title>

<style>
body{
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f2f2f2;
}

canvas{
  margin-top:20px;
}

#pointer{
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-bottom:30px solid red;
  margin:20px auto -10px;
}

button{
  padding:12px 30px;
  font-size:18px;
  cursor:pointer;
}

#result{
  font-size:20px;
  font-weight:bold;
  margin-top:15px;
}
</style>
</head>

<body>

<h2>🎉 Spin & Win 🎉</h2>

<div id="pointer"></div>
<canvas id="wheel" width="320" height="320"></canvas>

<br>
<button onclick="spin()">SPIN</button>

<p id="result"></p>

<script>
const prizes = [
  "10%",
  "30%",
  "50%",
  "Better luck next time",
  "Better luck next time",
  "Better luck next time",
  "Gift voucher"
];

const colors = [
  "#ff7675",
  "#74b9ff",
  "#55efc4",
  "#ffeaa7",
  "#fab1a0",
  "#a29bfe",
  "#fdcb6e"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const size = canvas.width;
const center = size / 2;
const radius = center - 10;
const slice = 2 * Math.PI / prizes.length;

let currentAngle = 0;
let spinning = false;

function drawWheel(){
  for(let i = 0; i < prizes.length; i++){
    let angle = currentAngle + i * slice;

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, angle, angle + slice);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.stroke();

    ctx.save();
    ctx.translate(
      center + Math.cos(angle + slice/2) * radius * 0.65,
      center + Math.sin(angle + slice/2) * radius * 0.65
    );
    ctx.rotate(angle + slice/2);
    ctx.fillStyle = "#000";
    ctx.font = "14px Arial";
    ctx.textAlign = "center";
    ctx.fillText(prizes[i], 0, 0);
    ctx.restore();
  }
}

drawWheel();

function spin(){
  if(spinning) return;
  spinning = true;
  document.getElementById("result").innerText = "";

  let spinAngle = Math.random() * 360 + 1440; // 4+ rounds
  let spinTime = 4000;
  let start = null;

  function animate(timestamp){
    if(!start) start = timestamp;
    let progress = timestamp - start;
    let ease = progress / spinTime;
    ease = 1 - Math.pow(1 - ease, 3);

    currentAngle = (spinAngle * ease) * Math.PI / 180;
    ctx.clearRect(0,0,size,size);
    drawWheel();

    if(progress < spinTime){
      requestAnimationFrame(animate);
    } else {
      spinning = false;

      let finalAngle = (currentAngle + Math.PI/2) % (2 * Math.PI);
      let index = Math.floor(prizes.length - (finalAngle / slice)) % prizes.length;

      document.getElementById("result").innerText =
        "🎁 Result: " + prizes[index];
    }
  }

  requestAnimationFrame(animate);
}
</script>

</body>
</html>
